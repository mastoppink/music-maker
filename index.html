<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#202823;font:16px Inter,system-ui,sans-serif}main{max-width:900px;margin:auto;padding:5vh 5vw}header{border-bottom:2px solid;padding-bottom:18px;font-weight:750}h1{font-size:clamp(38px,7vw,76px);letter-spacing:-.065em;margin:36px 0 24px}fieldset{border:0;padding:0;margin:20px 0}legend,label{font-weight:600}legend{margin-bottom:10px}.fields,.choices,.track,.transport{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.fields label{flex:1;min-width:140px}select,button{font:inherit;border:1px solid #848d82;border-radius:7px;padding:10px;background:#fff;color:inherit}select{display:block;width:100%;margin-top:7px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#254f3f;color:white;border:0;padding:13px 24px}input{accent-color:#35694c}.track{padding:15px 0;border-top:1px solid #abb6a9}.track strong{min-width:90px}.track label{font-size:14px}.track input[type=range]{vertical-align:middle;width:90px}.transport{margin:16px 0}.track button{margin-left:auto}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.filebutton{border:1px solid #848d82;border-radius:7px;padding:12px 18px;background:#fff;cursor:pointer;font-weight:600}.filebutton input{position:absolute;width:1px;height:1px;opacity:0}.filebutton:focus-within{outline:2px solid #35694c;outline-offset:2px}.track select{display:inline-block;width:auto;margin:0 0 0 6px;padding:6px 8px}section{margin-top:30px}output{font-variant-numeric:tabular-nums}
</style><main><header>Music Maker</header><h1>Studio instrumental</h1><form id="settings"><div class="fields"><label>Mood<select id="mood"><option>Tenang</option><option>Ceria</option><option>Melankolis</option></select></label><label>Genre<select id="genre"><option>Lo-fi</option><option selected>Akustik</option><option>Pop</option></select></label><label>Sumber<select id="source"><option value="kit">Kit orisinal</option><option value="klasik">Klasik (Bach)</option></select></label><label>Melodi<select id="melody"><option value="gantian">Gantian piano &amp; gitar</option><option value="piano">Piano saja</option></select></label><label>Durasi<select id="duration"><option value="30">30 detik</option><option selected value="60">1 menit</option><option value="120">2 menit</option><option value="180">3 menit</option><option value="300">5 menit</option></select></label></div><fieldset><legend>Lapisan instrumen</legend><div class="choices" id="choices"></div></fieldset><div class="actions"><button class="primary">Buat musik</button><label class="filebutton">Buka proyek<input type="file" id="open" accept=".json,application/json"></label></div></form><p role="status" id="message"></p><section id="studio" hidden><h2>Mix instrumental</h2><div class="transport"><button id="versionA">Versi A</button><button id="versionB">Versi B</button><button id="play">Putar</button><output id="time"></output><button id="export">Unduh WAV</button><button id="midi">Unduh MIDI</button><button id="save">Simpan proyek</button></div><div id="tracks"></div></section></main><script src="samples.js"></script><script src="classics.js"></script><script src="studio.js"></script></html>
